<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Post preview</title>
<style>
  :root {
    --bg: var(--color-background-primary, #ffffff);
    --soft: var(--color-background-secondary, #f3f3f1);
    --text: var(--color-text-primary, #1c1c1a);
    --muted: var(--color-text-secondary, #66665f);
    --line: var(--color-border-primary, #dcdcd6);
    --accent: #e03a40; --ok: #1d7a46; --warn: #a15c00;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: var(--color-background-primary, #1f1f1d); --soft: var(--color-background-secondary, #2a2a27);
      --text: var(--color-text-primary, #f1f1ec); --muted: var(--color-text-secondary, #a3a39a);
      --line: var(--color-border-primary, #3d3d38); --accent: #ff6a6f; --ok: #5fd08d; --warn: #f0b45a;
    }
  }
  :root[data-theme="dark"] {
    --bg: var(--color-background-primary, #1f1f1d); --soft: var(--color-background-secondary, #2a2a27);
    --text: var(--color-text-primary, #f1f1ec); --muted: var(--color-text-secondary, #a3a39a);
    --line: var(--color-border-primary, #3d3d38); --accent: #ff6a6f; --ok: #5fd08d; --warn: #f0b45a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; }
  body { color: var(--text); font: 15px/1.45 var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif); padding: 4px; }
  .card { background: var(--bg); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; max-width: 560px; margin: 0 auto; }
  .tabs { display: flex; gap: 6px; padding: 10px 12px 0; flex-wrap: wrap; }
  .tab { font: inherit; font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
  .tab[aria-selected="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
  .head { display: flex; align-items: center; gap: 10px; padding: 12px 14px 8px; }
  .avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; flex: none; }
  .page { font-weight: 700; line-height: 1.2; }
  .sub { font-size: 12.5px; color: var(--muted); }
  .caption { padding: 2px 14px 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .caption.clamped { display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; padding-bottom: 0; margin-bottom: 4px; }
  .more { font: inherit; font-weight: 600; color: var(--muted); background: none; border: 0; padding: 0 14px 10px; cursor: pointer; }
  .image { display: block; width: 100%; height: auto; background: var(--soft); }
  .noimage { background: var(--soft); color: var(--muted); text-align: center; padding: 36px 16px; font-size: 14px; }
  .bar { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .btn { font: inherit; font-size: 14px; font-weight: 600; padding: 8px 14px; border-radius: 9px; border: 1px solid var(--line); background: var(--soft); color: var(--text); cursor: pointer; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .info { padding: 10px 14px 12px; border-top: 1px solid var(--line); font-size: 13.5px; }
  .info h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 6px; }
  .info ul { margin: 0; padding-left: 18px; }
  .info li { margin: 2px 0; }
  .issues li { color: var(--warn); }
  .okline { color: var(--ok); font-weight: 600; }
  .idea { padding: 0 14px 8px; font-size: 13.5px; color: var(--muted); }
  .empty { padding: 28px 16px; text-align: center; color: var(--muted); }
  .sched { padding: 9px 14px; background: var(--soft); color: var(--ok); font-weight: 600; font-size: 14px; border-top: 1px solid var(--line); }
  .sched a { color: inherit; }
</style>
</head>
<body>
<div id="root"><div class="card"><div class="empty">…</div></div></div>
<script>
(() => {
  const T = {
    en: { copy: 'Copy caption', copied: 'Copied ✓', product: 'Open product page', more: 'See more', less: 'See less',
          check: 'Check the text in the image', issues: 'To double-check', noissues: 'No open issues', noimage: 'No image yet for this variant',
          baseline: 'Main variant', idea: 'Idea', sponsored: 'Post preview', scheduled: 'Scheduled on Facebook for', view: 'open', select: 'Select the caption and copy it' },
    bg: { copy: 'Копирай текста', copied: 'Копирано ✓', product: 'Отвори продукта', more: 'Виж още', less: 'Виж по-малко',
          check: 'Провери текста в картинката', issues: 'За проверка', noissues: 'Няма отворени забележки', noimage: 'Все още няма картинка за този вариант',
          baseline: 'Основен вариант', idea: 'Идея', sponsored: 'Преглед на поста', scheduled: 'Насрочено във Facebook за', view: 'отвори', select: 'Маркирай текста и го копирай' },
  };
  const t = T[(navigator.language || 'en').toLowerCase().startsWith('bg') ? 'bg' : 'en'];
  const root = document.getElementById('root');
  let data = null, images = {}, selected = null, expanded = false;

  // --- MCP Apps bridge (JSON-RPC over postMessage), no SDK needed ---
  let nextId = 1;
  const pending = new Map();
  const post = (msg) => window.parent.postMessage({ jsonrpc: '2.0', ...msg }, '*');
  const request = (method, params) => new Promise((resolve, reject) => {
    const id = nextId++;
    pending.set(id, { resolve, reject });
    post({ id, method, params });
    setTimeout(() => { if (pending.delete(id)) reject(new Error('timeout')); }, 8000);
  });
  const notify = (method, params) => post({ method, params });

  function applyHost(ctx) {
    if (!ctx) return;
    if (ctx.theme === 'dark' || ctx.theme === 'light') document.documentElement.dataset.theme = ctx.theme;
    const vars = ctx.styles && ctx.styles.variables;
    if (vars) for (const [k, v] of Object.entries(vars)) if (typeof v === 'string') document.documentElement.style.setProperty(k, v);
  }
  function accept(result) {
    if (!result) return;
    const sc = result.structuredContent || result;
    if (!sc || !Array.isArray(sc.variants)) return;
    data = sc;
    images = (result._meta && result._meta.images) || images;
    if (!selected || !data.variants.some((v) => v.variant === selected)) selected = data.selected || (data.variants[0] && data.variants[0].variant);
    render();
  }
  window.addEventListener('message', (e) => {
    const m = e.data;
    if (!m || m.jsonrpc !== '2.0') return;
    if (m.id !== undefined && pending.has(m.id) && !m.method) {
      const p = pending.get(m.id); pending.delete(m.id);
      m.error ? p.reject(new Error(m.error.message || 'error')) : p.resolve(m.result);
      return;
    }
    if (m.method === 'ui/notifications/tool-result') accept(m.params);
    else if (m.method === 'ui/notifications/host-context-changed') applyHost(m.params);
    else if (m.method === 'ui/resource-teardown' && m.id !== undefined) post({ id: m.id, result: {} });
    else if (m.method === 'ping' && m.id !== undefined) post({ id: m.id, result: {} });
  });

  // ChatGPT compatibility globals, when present.
  function fromOpenAI() {
    const o = window.openai;
    if (!o) return;
    if (o.theme) document.documentElement.dataset.theme = o.theme;
    if (o.toolOutput) accept({ structuredContent: o.toolOutput, _meta: o.toolResponseMetadata });
  }
  window.addEventListener('openai:set_globals', fromOpenAI);

  const el = (tag, props = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (k === 'class') n.className = v; else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
      else if (v !== false && v != null) n.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) n.append(kid);
    return n;
  };
  const label = (v) => v.variant === 'baseline' ? t.baseline : (v.title || `${t.idea} ${v.variant.replace('idea_', '')}`);

  async function copy(text, btn) {
    let done = false;
    try { await navigator.clipboard.writeText(text); done = true; } catch {
      try {
        const ta = el('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.append(ta); ta.select(); done = document.execCommand('copy'); ta.remove();
      } catch {}
    }
    if (done) { btn.textContent = t.copied; setTimeout(() => { btn.textContent = t.copy; }, 1800); }
    else {
      expanded = true; render();
      const c = root.querySelector('.caption'); const r = document.createRange(); r.selectNodeContents(c);
      const s = getSelection(); s.removeAllRanges(); s.addRange(r);
      root.querySelector('.btn.primary').textContent = t.select;
    }
  }
  function openLink(url) {
    request('ui/open-link', { url }).catch(() => {
      if (window.openai && window.openai.openExternal) window.openai.openExternal({ href: url });
      else window.open(url, '_blank', 'noopener');
    });
  }

  function render() {
    if (!data) return;
    const v = data.variants.find((x) => x.variant === selected) || data.variants[0];
    if (!v) { root.replaceChildren(el('div', { class: 'card' }, el('div', { class: 'empty' }, t.noimage))); return; }
    const page = (data.page && data.page.name) || (data.product && data.product.name) || '';
    const long = v.caption.length > 320 || v.caption.split('\n').length > 6;
    const img = images[v.variant];
    const copyBtn = el('button', { class: 'btn primary', onclick: () => copy(v.caption, copyBtn) }, t.copy);
    root.replaceChildren(el('div', { class: 'card' },
      data.variants.length > 1 && el('div', { class: 'tabs', role: 'tablist' }, data.variants.map((x) =>
        el('button', { class: 'tab', role: 'tab', 'aria-selected': String(x.variant === v.variant),
          onclick: () => { selected = x.variant; expanded = false; render(); } }, label(x)))),
      el('div', { class: 'head' },
        el('div', { class: 'avatar' }, (page.trim()[0] || '•').toUpperCase()),
        el('div', {}, el('div', { class: 'page' }, page), el('div', { class: 'sub' }, t.sponsored))),
      v.angle && el('div', { class: 'idea' }, v.angle),
      el('div', { class: 'caption' + (long && !expanded ? ' clamped' : '') }, v.caption),
      long && el('button', { class: 'more', onclick: () => { expanded = !expanded; render(); } }, expanded ? t.less : t.more),
      img ? el('img', { class: 'image', onload: reportSize, src: img, alt: (v.image_text[0] && v.image_text[0].text) || data.product.name })
          : el('div', { class: 'noimage' }, v.image_file ? v.image_file : t.noimage),
      v.scheduled && el('div', { class: 'sched' }, '✓ ' + t.scheduled + ' ' + new Date(v.scheduled.for).toLocaleString(navigator.language || 'en', { dateStyle: 'medium', timeStyle: 'short' }),
        v.scheduled.permalink && ' · ', v.scheduled.permalink && el('a', { href: '#', onclick: (e) => { e.preventDefault(); openLink(v.scheduled.permalink); } }, t.view)),
      el('div', { class: 'bar' }, copyBtn,
        data.product && data.product.url && el('button', { class: 'btn', onclick: () => openLink(data.product.url) }, t.product)),
      v.image_text.length > 0 && el('div', { class: 'info' }, el('h3', {}, t.check),
        el('ul', {}, v.image_text.map((b) => el('li', {}, b.text)))),
      el('div', { class: 'info' }, el('h3', {}, t.issues),
        v.issues.length ? el('ul', { class: 'issues' }, v.issues.map((i) => el('li', {}, i)))
                        : el('div', { class: 'okline' }, t.noissues)),
    ));
    reportSize();
  }

  let lastH = 0;
  function reportSize() {
    // The card's own height, not the frame's: the frame may currently be shorter or taller than the content.
    const h = Math.ceil(root.getBoundingClientRect().height) + 8;
    if (h > 8 && h !== lastH) { lastH = h; notify('ui/notifications/size-changed', { width: Math.ceil(root.getBoundingClientRect().width) + 8, height: h }); }
  }
  if (window.ResizeObserver) new ResizeObserver(reportSize).observe(root);
  window.addEventListener('load', reportSize);

  fromOpenAI();
  request('ui/initialize', {
    protocolVersion: '2026-01-26',
    appInfo: { name: 'CloudCart Marketing post card', version: '1.0.0' },
    appCapabilities: { availableDisplayModes: ['inline'] },
  }).then((res) => { applyHost(res && res.hostContext); notify('ui/notifications/initialized', {}); })
    .catch(() => { /* not an MCP Apps host; the openai globals may still deliver the data */ });
})();
</script>
</body>
</html>
